<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoadBot | Local Hoster</title>
    <style>
        :root {
            --bg-color: #060202;
            --panel-bg: #110505;
            --accent-red: #ff3333;
            --accent-glow: #ff0000;
            --text-main: #ffffff;
            --text-muted: #845c5c;
            --success: #00ff66;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: 
                linear-gradient(rgba(255, 51, 51, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 51, 51, 0.02) 1px, transparent 1px),
                radial-gradient(circle at 50% 0%, #470c0c 0%, var(--bg-color) 80%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
        }

        header {
            width: 100%;
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255, 51, 51, 0.1);
            background: rgba(6, 2, 2, 0.85);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .brand { font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
        .brand span { color: var(--accent-red); text-shadow: 0 0 10px var(--accent-glow); }

        main { width: 100%; max-width: 800px; padding: 40px 20px; }

        .panel {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 51, 51, 0.1);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            margin-bottom: 20px;
        }

        .status-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 51, 51, 0.05);
        }

        .status-badge {
            background: #250c0c;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 14px;
            color: var(--accent-red);
            border: 1px solid rgba(255, 51, 51, 0.2);
        }

        .status-badge.online {
            color: var(--success);
            border-color: var(--success);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 1px; }
        
        input[type="text"] {
            width: 100%;
            background: #180808;
            border: 1px solid rgba(255, 51, 51, 0.1);
            padding: 12px;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { outline: none; border-color: var(--accent-red); }

        .btn-container { display: flex; gap: 15px; }

        button {
            flex: 1;
            padding: 14px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            border: none;
        }

        .start-btn { background: var(--accent-red); color: white; box-shadow: 0 4px 15px rgba(255, 51, 51, 0.3); }
        .start-btn:hover { background: #ff1a1a; transform: translateY(-1px); }
        .stop-btn { background: #250c0c; color: var(--text-muted); border: 1px solid rgba(255, 51, 51, 0.1); }
        .stop-btn:hover { background: #381212; color: #fff; }

        /* Konsole / Live Logs */
        .console {
            background: #000000;
            border: 1px solid #220808;
            border-radius: 6px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: #ff9999;
        }
        .console .log-entry { margin-bottom: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">Load<span>Bot</span> Hoster</div>
    </header>

    <main>
        <div class="panel">
            <div class="status-box">
                <h2>Bot Management</h2>
                <div id="status" class="status-badge">Offline</div>
            </div>

            <div class="input-group">
                <label>Discord Bot Token</label>
                <input type="text" id="token-input" placeholder="MTA4ODk1MDU2M..." value="">
            </div>

            <div class="btn-container">
                <button class="start-btn" onclick="startBot()">Bot Starten</button>
                <button class="stop-btn" onclick="stopBot()">Stoppen</button>
            </div>
        </div>

        <div class="panel">
            <label>Live Console Logs</label>
            <div class="console" id="console-logs">
                <div class="log-entry">[System] Bereit zum Starten. Wenn du deinen PC ausschaltest, geht der Bot offline!</div>
            </div>
        </div>
    </main>

    <script>
        // Verbindung zum lokalen Backend herstellen
        function log(message) {
            const consoleBox = document.getElementById("console-logs");
            const entry = document.createElement("div");
            entry.className = "log-entry";
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleBox.appendChild(entry);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        async function startBot() {
            const token = document.getElementById("token-input").value;
            if(!token) return alert("Bitte trage einen Token ein!");

            log("Starte Bot-Prozess auf deinem PC...");
            
            const response = await fetch('/api/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token })
            });
            const data = await response.json();
            
            if(data.success) {
                document.getElementById("status").innerText = "ONLINE";
                document.getElementById("status").classList.add("online");
                log("Bot ist jetzt ONLINE!");
            } else {
                log("Fehler beim Starten: " + data.error);
            }
        }

        async function stopBot() {
            log("Stoppe Bot...");
            const response = await fetch('/api/stop', { method: 'POST' });
            const data = await response.json();
            
            document.getElementById("status").innerText = "OFFLINE";
            document.getElementById("status").classList.remove("online");
            log("Bot wurde beendet.");
        }
    </script>
</body>
</html>
