<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoadTiers | Rankings</title>
    <style>
        /* --- DESIGN SYSTEM (NEON RED GAMING LOOK) --- */
        :root {
            --bg-color: #060202;
            --panel-bg: #110505;
            --row-bg: #180808;
            --row-hover: #260d0d;
            --accent-red: #ff3333;       /* Klares Neon-Rot */
            --accent-glow: #ff0000;      /* Für Leuchteffekte */
            --text-main: #ffffff;
            --text-muted: #784e4e;
            --text-gold: #ffd700;
            --text-silver: #c0c0c0;
            --text-bronze: #cd7f32;
            
            /* Tier Badge Colors */
            --ht-color: #ff3333;
            --lt-color: #ffaa00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Rotes Grid-Muster im Hintergrund */
            background-image: 
                linear-gradient(rgba(255, 51, 51, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 51, 51, 0.02) 1px, transparent 1px),
                radial-gradient(circle at 50% 0%, #470c0c 0%, var(--bg-color) 80%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
        }

        /* --- NAVBAR --- */
        header {
            width: 100%;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 51, 51, 0.1);
            background: rgba(6, 2, 2, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .brand span {
            color: var(--accent-red);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: #a88a8a;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            padding: 5px 0;
            border-bottom: 2px solid transparent;
        }

        .nav-links a.active, .nav-links a:hover {
            color: var(--accent-red);
            border-bottom: 2px solid var(--accent-red);
            text-shadow: 0 0 8px var(--accent-glow);
        }

        /* --- SUB-NAVBAR (GAMEMODES) --- */
        .gamemode-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            padding: 15px;
            background: rgba(17, 5, 5, 0.6);
            border-bottom: 1px solid rgba(255, 51, 51, 0.05);
            flex-wrap: wrap;
        }

        .gamemode-nav button {
            background: rgba(255, 51, 51, 0.03);
            border: 1px solid rgba(255, 51, 51, 0.1);
            color: #845c5c;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            padding: 6px 16px;
            border-radius: 4px;
        }

        .gamemode-nav button.active, .gamemode-nav button:hover {
            color: var(--text-main);
            background: rgba(255, 51, 51, 0.2);
            border-color: var(--accent-red);
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
        }

        /* --- MAIN CONTAINER --- */
        main {
            width: 100%;
            max-width: 1300px;
            padding: 40px 20px;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .discord-btn {
            background: #5865f2;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
            transition: transform 0.2s, background 0.2s;
        }

        .discord-btn:hover {
            transform: translateY(-2px);
            background: #4752c4;
        }

        /* --- LEADERBOARD TABLE --- */
        .leaderboard-panel {
            background: var(--panel-bg);
            border-radius: 12px;
            border: 1px solid rgba(255, 51, 51, 0.1);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .table-header {
            display: grid;
            grid-template-columns: 60px 280px 1fr 100px;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255, 51, 51, 0.1);
            font-size: 11px;
            font-weight: 800;
            color: #845c5c;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .table-row {
            display: grid;
            grid-template-columns: 60px 280px 1fr 100px;
            padding: 12px 20px;
            align-items: center;
            background: var(--row-bg);
            border-bottom: 1px solid rgba(255, 51, 51, 0.03);
            transition: background 0.15s;
        }

        .table-row:hover {
            background: var(--row-hover);
        }

        /* Rank Styling */
        .rank {
            font-weight: 900;
            font-size: 16px;
            color: #a88a8a;
        }
        .table-row:nth-child(2) .rank { color: var(--text-gold); font-size: 18px; text-shadow: 0 0 5px rgba(255,215,0,0.3); }
        .table-row:nth-child(3) .rank { color: var(--text-silver); font-size: 18px; }
        .table-row:nth-child(4) .rank { color: var(--text-bronze); font-size: 18px; }

        /* Player Profile Info */
        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar-wrapper {
            position: relative;
            width: 38px;
            height: 38px;
        }

        .player-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #221111;
            border: 2px solid rgba(255, 51, 51, 0.2);
        }

        .player-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .player-name {
            font-weight: 700;
            font-size: 15px;
            color: #ffffff;
        }

        .player-sub {
            font-size: 11px;
            color: #845c5c;
            font-weight: 600;
        }

        /* Tiers Badges Area */
        .player-tiers {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .tier-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px;
            border-radius: 8px;
            min-width: 44px;
            border: 1px solid rgba(255, 51, 51, 0.05);
        }

        .tier-icon-circle {
            width: 28px;
            height: 28px;
            background: #250c0c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 51, 51, 0.2);
        }

        .tier-icon-circle img {
            width: 18px;
            height: 18px;
        }

        .tier-sub-text {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .tier-sub-text.ht { color: var(--ht-color); }
        .tier-sub-text.lt { color: var(--lt-color); }

        /* Points Column */
        .points {
            font-weight: 800;
            font-size: 15px;
            color: var(--accent-red);
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.5);
            text-align: right;
            padding-right: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">Load<span>Tiers</span></div>
        <div class="nav-links">
            <a href="#" class="nav-item active" onclick="changeTab(event, 'rankings')">Rankings</a>
            <a href="#" class="nav-item" onclick="changeTab(event, 'staff')">Staff</a>
            <a href="https://discord.gg/DEIN-LINK" target="_blank">Discord</a>
        </div>
    </header>

    <div class="gamemode-nav">
        <button class="gm-btn active" onclick="filterGamemode(event, 'overall')">Overall</button>
        <button class="gm-btn" onclick="filterGamemode(event, 'sword')">Sword</button>
        <button class="gm-btn" onclick="filterGamemode(event, 'cpvp')">CPvP</button>
        <button class="gm-btn" onclick="filterGamemode(event, 'axe')">Axe</button>
        <button class="gm-btn" onclick="filterGamemode(event, 'smp')">SMP</button>
        <button class="gm-btn" onclick="filterGamemode(event, 'uhc')">UHC</button>
    </div>

    <main>
        <div class="top-bar">
            <a href="https://discord.gg/DEIN-LINK" target="_blank" class="discord-btn">Join Discord</a>
        </div>

        <div class="leaderboard-panel">
            
            <div class="table-header">
                <div>#</div>
                <div>Player</div>
                <div>Tiers</div>
                <div style="text-align: right; padding-right: 10px;">Pts</div>
            </div>

            <div id="leaderboard-content">
                </div>

        </div>
    </main>

    <script>
        // Beispiel-Datenbank für deine Spieler und deren Tiers in den Modi
        const playersData = [
            {
                rank: 1,
                name: "octryx ★",
                ign: "octryx",
                sub: "HT1 ◆ 206 pts",
                points: 206,
                tiers: {
                    overall: [
                        { icon: "https://minecraft.wiki/images/End_Crystal_JE2_BE2.png", type: "ht", label: "HT1" },
                        { icon: "https://minecraft.wiki/images/Diamond_Sword_JE3_BE3.png", type: "ht", label: "HT1" },
                        { icon: "https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2_BE2.png", type: "ht", label: "HT2" }
                    ],
                    cpvp: [{ icon: "https://minecraft.wiki/images/End_Crystal_JE2_BE2.png", type: "ht", label: "HT1" }],
                    sword: [{ icon: "https://minecraft.wiki/images/Diamond_Sword_JE3_BE3.png", type: "ht", label: "HT1" }]
                }
            },
            {
                rank: 2,
                name: "zNiclas_",
                ign: "zNiclas_",
                sub: "HT1 ◆ 116 pts",
                points: 116,
                tiers: {
                    overall: [
                        { icon: "https://minecraft.wiki/images/Netherite_Axe_JE2.png", type: "ht", label: "HT1" },
                        { icon: "https://minecraft.wiki/images/Diamond_Sword_JE3_BE3.png", type: "lt", label: "LT2" }
                    ],
                    axe: [{ icon: "https://minecraft.wiki/images/Netherite_Axe_JE2.png", type: "ht", label: "HT1" }],
                    sword: [{ icon: "https://minecraft.wiki/images/Diamond_Sword_JE3_BE3.png", type: "lt", label: "LT2" }]
                }
            },
            {
                rank: 3,
                name: "DeinName",
                ign: "Steve",
                sub: "HT4 ◆ 74 pts",
                points: 74,
                tiers: {
                    overall: [{ icon: "https://minecraft.wiki/images/End_Crystal_JE2_BE2.png", type: "ht", label: "HT4" }],
                    cpvp: [{ icon: "https://minecraft.wiki/images/End_Crystal_JE2_BE2.png", type: "ht", label: "HT4" }]
                }
            }
        ];

        // Funktion: Rendert das Leaderboard basierend auf dem ausgewählten Gamemode
        function renderLeaderboard(gamemode) {
            const container = document.getElementById("leaderboard-content");
            container.innerHTML = ""; // Altes löschen

            // Filtere Spieler, die in diesem Modus gelistet sind
            playersData.forEach(player => {
                if (player.tiers[gamemode]) {
                    let badgesHTML = "";
                    player.tiers[gamemode].forEach(badge => {
                        badgesHTML += `
                            <div class="tier-badge">
                                <div class="tier-icon-circle"><img src="${badge.icon}" alt="badge"></div>
                                <span class="tier-sub-text ${badge.type}">${badge.label}</span>
                            </div>
                        `;
                    });

                    const rowHTML = `
                        <div class="table-row">
                            <div class="rank">${player.rank}</div>
                            <div class="player-info">
                                <div class="avatar-wrapper">
                                    <img class="player-avatar" src="https://mc-heads.net/avatar/${player.ign}/38" alt="">
                                </div>
                                <div class="player-details">
                                    <span class="player-name">${player.name}</span>
                                    <span class="player-sub">${player.sub}</span>
                                </div>
                            </div>
                            <div class="player-tiers">${badgesHTML}</div>
                            <div class="points">${player.points}</div>
                        </div>
                    `;
                    container.innerHTML += rowHTML;
                }
            });
        }

        // Funktion: Klick-Event für Gamemode Buttons
        function filterGamemode(event, mode) {
            // Alle Gamemode Buttons deaktivieren
            document.querySelectorAll(".gm-btn").forEach(btn => btn.classList.remove("active"));
            // Geklickten Button aktivieren
            event.target.classList.add("active");
            // Liste neu laden
            renderLeaderboard(mode);
        }

        // Funktion: Klick-Event für die Haupt-Navbar (Rankings / Staff)
        function changeTab(event, tabName) {
            event.preventDefault();
            document.querySelectorAll(".nav-item").forEach(item => item.classList.remove("active"));
            event.target.classList.add("active");
            
            if (tabName === 'staff') {
                document.getElementById("leaderboard-content").innerHTML = `
                    <div style="padding: 40px; text-align: center; color: #845c5c; font-weight: bold;">
                        Staff-Mitglieder werden hier bald angezeigt!
                    </div>
                `;
            } else {
                renderLeaderboard('overall');
            }
        }

        // Beim ersten Laden der Seite direkt "Overall" anzeigen
        window.onload = function() {
            renderLeaderboard('overall');
        };
    </script>
</body>
</html>
