<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoadTiers | Rankings</title>
    <style>
        /* --- DESIGN SYSTEM (ICON TIERS LOOK) --- */
        :root {
            --bg-color: #030914;
            --panel-bg: #071120;
            --row-bg: #09162a;
            --row-hover: #0d203d;
            --accent-cyan: #00bfff;
            --accent-blue: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #4e6178;
            --text-gold: #ffd700;
            --text-silver: #c0c0c0;
            --text-bronze: #cd7f32;
            
            /* Tier Badge Colors */
            --ht-color: #ff5555;
            --lt-color: #ffaa00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Subtiles Grid-Muster im Hintergrund wie auf dem Screenshot */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                radial-gradient(circle at 50% 0%, #0c2347 0%, var(--bg-color) 80%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
        }

        /* --- NAVBAR --- */
        header {
            width: 100%;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(3, 9, 20, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .brand span {
            color: var(--accent-cyan);
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: #8a9ba8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s;
            padding: 5px 0;
        }

        .nav-links a.active, .nav-links a:hover {
            color: var(--accent-cyan);
            border-bottom: 2px solid var(--accent-cyan);
        }

        /* --- SUB-NAVBAR (GAMEMODES) --- */
        .gamemode-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            padding: 15px;
            background: rgba(7, 17, 32, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .gamemode-nav button {
            background: none;
            border: none;
            color: #5c6f84;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.2s;
            padding: 5px 10px;
        }

        .gamemode-nav button.active, .gamemode-nav button:hover {
            color: var(--accent-cyan);
        }

        /* --- MAIN CONTAINER --- */
        main {
            width: 100%;
            max-width: 1300px;
            padding: 40px 20px;
        }

        .discord-btn-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .discord-btn {
            background: #5865f2;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
            transition: transform 0.2s, background 0.2s;
        }

        .discord-btn:hover {
            transform: translateY(-2px);
            background: #4752c4;
        }

        /* --- LEADERBOARD TABLE --- */
        .leaderboard-panel {
            background: var(--panel-bg);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .table-header {
            display: grid;
            grid-template-columns: 60px 280px 1fr 100px;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 11px;
            font-weight: 800;
            color: #5c6f84;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .table-row {
            display: grid;
            grid-template-columns: 60px 280px 1fr 100px;
            padding: 12px 20px;
            align-items: center;
            background: var(--row-bg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            transition: background 0.15s;
        }

        .table-row:hover {
            background: var(--row-hover);
        }

        /* Rank Styling */
        .rank {
            font-weight: 900;
            font-size: 16px;
            color: #8a9ba8;
        }
        .table-row:nth-child(2) .rank { color: var(--text-gold); font-size: 18px; }   /* 1st */
        .table-row:nth-child(3) .rank { color: var(--text-silver); font-size: 18px; } /* 2nd */
        .table-row:nth-child(4) .rank { color: var(--text-bronze); font-size: 18px; } /* 3rd */

        /* Player Profile Info */
        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar-wrapper {
            position: relative;
            width: 38px;
            height: 38px;
        }

        .player-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%; /* Runde Avatare wie im Bild */
            background: #112233;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .player-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .player-name {
            font-weight: 700;
            font-size: 15px;
            color: #ffffff;
        }

        .player-sub {
            font-size: 11px;
            color: #5c6f84;
            font-weight: 600;
        }

        /* Tiers/Gamemodes Badges Area */
        .player-tiers {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        /* Einzelnes Icon + Text Block */
        .tier-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px;
            border-radius: 8px;
            min-width: 44px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* Die runden Kreise für Items */
        .tier-icon-circle {
            width: 28px;
            height: 28px;
            background: #101f35;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tier-icon-circle img {
            width: 18px;
            height: 18px;
        }

        /* Kleiner Text unter dem Icon (z.B. HT1) */
        .tier-sub-text {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .tier-sub-text.ht { color: var(--ht-color); }
        .tier-sub-text.lt { color: var(--lt-color); }

        /* Points Column (Right Side) */
        .points {
            font-weight: 800;
            font-size: 15px;
            color: var(--accent-cyan);
            text-align: right;
            padding-right: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">Load<span>Tiers</span></div>
        <div class="nav-links">
            <a href="#" class="active">Rankings</a>
            <a href="#">Staff</a>
            <a href="#">Discord</a>
        </div>
    </header>

    <div class="gamemode-nav">
        <button class="active">Overall</button>
        <button>Sword</button>
        <button>CPvP</button>
        <button>Axe</button>
        <button>SMP</button>
        <button>UHC</button>
        <button>Pot</button>
    </div>

    <main>
        <div class="discord-btn-container">
            <a href="#" class="discord-btn">
                <span>Join Discord</span>
            </a>
        </div>

        <div class="leaderboard-panel">
            
            <div class="table-header">
                <div>#</div>
                <div>Player</div>
                <div>Tiers</div>
                <div style="text-align: right; padding-right: 10px;">Pts</div>
            </div>

            <div class="table-row">
                <div class="rank">1</div>
                <div class="player-info">
                    <div class="avatar-wrapper">
                        <img class="player-avatar" src="https://mc-heads.net/avatar/octryx/38" alt="">
                    </div>
                    <div class="player-details">
                        <span class="player-name">octryx ★</span>
                        <span class="player-sub">? HT1 ◆ 206 pts</span>
                    </div>
                </div>
                <div class="player-tiers">
                    <div class="tier-badge">
                        <div class="tier-icon-circle"><img src="https://minecraft.wiki/images/End_Crystal_JE2_BE2.png" alt="CPvP"></div>
                        <span class="tier-sub-text ht">HT1</span>
                    </div>
                    <div class="tier-badge">
                        <div class="tier-icon-circle"><img src="https://minecraft.wiki/images/Diamond_Sword_JE3_BE3.png" alt="Sword"></div>
                        <span class="tier-sub-text ht">HT1</span>
                    </div>
                    <div class="tier-badge">
                        <div class="tier-icon-circle"><img src="https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2_BE2.png" alt="Pot"></div>
                        <span class="tier-sub-text ht">HT2</span>
                    </div>
                </div>
                <div class="points">206</div>
            </div>

            <div class="table-row">
                <div class="rank">2</div>
                <div class="player-info">
                    <div class="avatar-wrapper">
                        <img class="player-avatar" src="https://mc-heads.net/avatar/zNiclas_/38" alt="">
                    </div>
                    <div class="player-details">
                        <span class="player-name">zNiclas_</span>
                        <span class="player-sub">? HT1 ◆ 116 pts</span>
                    </div>
                </div>
                <div class="player-tiers">
                    <div class="tier-badge">
                        <div class="tier-icon-circle"><img src="https://minecraft.wiki/images/Netherite_Axe_JE2.png" alt="Axe"></div>
                        <span class="tier-sub-text ht">HT1</span>
                    </div>
                    <div class="tier-badge">
                        <div class="tier-icon-circle"><img src="https://minecraft.wiki/images/Diamond_Sword_JE3_BE3.png" alt="Sword"></div>
                        <span class="tier-sub-text lt">LT2</span>
                    </div>
                </div>
                <div class="points">116</div>
            </div>

            <div class="table-row">
                <div class="rank">3</div>
                <div class="player-info">
                    <div class="avatar-wrapper">
                        <img class="player-avatar" src="https://mc-heads.net/avatar/Steve/38" alt="">
                    </div>
                    <div class="player-details">
                        <span class="player-name">DeinName</span>
                        <span class="player-sub">? HT4 ◆ 74 pts</span>
                    </div>
                </div>
                <div class="player-tiers">
                    <div class="tier-badge">
                        <div class="tier-icon-circle"><img src="https://minecraft.wiki/images/End_Crystal_JE2_BE2.png" alt="CPvP"></div>
                        <span class="tier-sub-text ht">HT4</span>
                    </div>
                </div>
                <div class="points">74</div>
            </div>

        </div>
    </main>

</body>
</html>
