<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoadTiers | Official Tierlist</title>
    <style>
        /* --- GLOBAL STYLES & CYBERPUNK THEME --- */
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #121216;
            --accent-color: #7289da; /* Discord Blue / Custom Glow */
            --text-main: #ffffff;
            --text-muted: #8e9297;
            
            /* Tier Colors */
            --color-ht1: #ff3333;
            --color-lt1: #ff6666;
            --color-ht2: #ff9933;
            --color-lt2: #ffb366;
            --color-ht3: #ffff33;
            --color-lt3: #ffff80;
            --color-ht4: #33cc33;
            --color-lt4: #66ff66;
            --color-ht5: #3399ff;
            --color-lt5: #66b2ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #1a1a24 0%, var(--bg-color) 70%);
        }

        /* --- HEADER & NAVIGATION --- */
        header {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f1f27;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo span {
            color: var(--accent-color);
            -webkit-text-fill-color: initial;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* --- MAIN CONTAINER --- */
        main {
            width: 100%;
            max-width: 1200px;
            padding: 40px 20px;
            flex-grow: 1;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 50px;
        }

        .hero-section h1 {
            font-size: 42px;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .hero-section p {
            color: var(--text-muted);
            font-size: 16px;
        }

        /* --- TIERLIST CONTAINER --- */
        .tierlist-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(18, 18, 22, 0.6);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #1f1f27;
            backdrop-filter: blur(10px);
        }

        /* --- TIER ROW --- */
        .tier-row {
            display: flex;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #1f1f27;
            transition: transform 0.2s, border-color 0.2s;
        }

        .tier-row:hover {
            border-color: #2f2f3d;
            transform: translateY(-2px);
        }

        /* Tier Label (Left Side) */
        .tier-label {
            width: 120px;
            min-width: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
        }

        /* Tier Specific Colors */
        .ht1 { background: var(--color-ht1); color: #000; }
        .lt1 { background: var(--color-lt1); color: #000; }
        .ht2 { background: var(--color-ht2); color: #000; }
        .lt2 { background: var(--color-lt2); color: #000; }
        .ht3 { background: var(--color-ht3); color: #000; }
        .lt3 { background: var(--color-lt3); color: #000; }
        .ht4 { background: var(--color-ht4); color: #000; }
        .lt4 { background: var(--color-lt4); color: #000; }
        .ht5 { background: var(--color-ht5); color: #000; }
        .lt5 { background: var(--color-lt5); color: #000; }

        /* Players Area (Right Side) */
        .tier-players {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 15px;
            align-items: center;
        }

        /* --- PLAYER CARD --- */
        .player-card {
            background: #181820;
            padding: 8px 14px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #262633;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: all 0.2s ease;
        }

        .player-card:hover {
            background: #1f1f2a;
            border-color: var(--accent-color);
            box-shadow: 0 0 12px rgba(114, 137, 218, 0.3);
            cursor: pointer;
        }

        /* Minecraft Avatar Style (Square/Retro) */
        .player-avatar {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            background: #333;
            image-rendering: pixelated; /* Perfekt für MC Skins */
        }

        .player-name {
            font-size: 14px;
            font-weight: 600;
            color: #e0e0e6;
        }

        /* --- FOOTER --- */
        footer {
            width: 100%;
            padding: 30px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            border-top: 1px solid #1f1f27;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Load<span>Tiers</span></div>
        <nav>
            <a href="#" class="active">Crystal PvP</a>
            <a href="#">UHC</a>
            <a href="#">Discord</a>
        </nav>
    </header>

    <main>
        <section class="hero-section">
            <h1>Official Tierlist</h1>
            <p>Die aktuellen Platzierungen der besten Spieler.</p>
        </section>

        <section class="tierlist-container">
            
            <div class="tier-row">
                <div class="tier-label ht1">HT1</div>
                <div class="tier-players">
                    <div class="player-card">
                        <img class="player-avatar" src="https://mc-heads.net/avatar/PlayerOne/24" alt="">
                        <span class="player-name">PlayerOne</span>
                    </div>
                </div>
            </div>

            <div class="tier-row">
                <div class="tier-label lt1">LT1</div>
                <div class="tier-players">
                    <div class="player-card">
                        <img class="player-avatar" src="https://mc-heads.net/avatar/PlayerTwo/24" alt="">
                        <span class="player-name">PlayerTwo</span>
                    </div>
                </div>
            </div>

            <div class="tier-row">
                <div class="tier-label ht4">HT4</div>
                <div class="tier-players">
                    <div class="player-card">
                        <img class="player-avatar" src="https://mc-heads.net/avatar/DeinMinecraftName/24" alt="">
                        <span class="player-name">DeinName</span>
                    </div>
                </div>
            </div>

            <div class="tier-row">
                <div class="tier-label lt4">LT4</div>
                <div class="tier-players">
                    <div class="player-card">
                        <img class="player-avatar" src="https://mc-heads.net/avatar/Steve/24" alt="">
                        <span class="player-name">Steve</span>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <footer>
        &copy; 2026 LoadTiers. Not affiliated with Mojang Studios.
    </footer>

</body>
</html>
